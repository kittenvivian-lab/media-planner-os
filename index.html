<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>團隊進度看板</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; }
        ::-webkit-scrollbar { width: 11px; height: 11px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 6px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .theme-dot { transition: transform 0.15s, box-shadow 0.15s; }
        .theme-dot.active { border-color: white !important; transform: scale(1.35); box-shadow: 0 0 0 3px rgba(255,255,255,0.25); }
        [data-theme="rose"] header { background: linear-gradient(to right, #7a5c5f, #9c7a7d, #b59093) !important; }
        [data-theme="rose"] body { background-color: #f7f3f0 !important; }
        /* ... (保留你既有的主題 CSS) ... */
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">
    <div id="auth-gate" class="fixed inset-0 z-[999] bg-gradient-to-br from-slate-900 via-indigo-950 to-indigo-900 flex items-center justify-center p-4">
        <div id="auth-gate-card" class="bg-white rounded-2xl shadow-2xl p-8 max-w-sm w-full text-center"></div>
    </div>

    <div id="app-root" class="hidden flex flex-col justify-between min-h-screen w-full">
    <!-- Header 與導航維持原狀 -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">
        <!-- Dashboard -->
        <div id="view-dashboard" class="global-view block space-y-6">
            <div class="flex justify-between items-center bg-white p-5 rounded-2xl border border-slate-100">
                <label class="flex items-center gap-2 font-bold text-sm cursor-pointer">
                    <input type="checkbox" id="show-archived-campaigns" onchange="renderUI()" class="w-4 h-4"> 顯示已封存專案
                </label>
                <button onclick="openCampaignModal('add')" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm px-4 py-2.5 rounded-xl">➕ 新增專案</button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="campaign-grid"></div>
        </div>
        <!-- 其餘 View 區塊略 -->
    </main>
    </div>

    <script>
        let state = { campaigns: [], adminTasks: [], notices: [], leaveHandoffs: [], adminArchive: [], campaignArchive: [] };
        
        // 1. 自動封存行政事項 (超過 60 天)
        function archiveOldAdminTasks() {
            const now = new Date();
            const threshold = 60 * 24 * 60 * 60 * 1000;
            const toArchive = state.adminTasks.filter(t => t.status === 'done' && t.rawDate && (now - new Date(t.rawDate) > threshold));
            if (toArchive.length > 0) {
                state.adminArchive = [...state.adminArchive, ...toArchive];
                state.adminTasks = state.adminTasks.filter(t => !(t.status === 'done' && t.rawDate && (now - new Date(t.rawDate) > threshold)));
                saveStateToStorage();
            }
        }

        // 2. 專案手動封存
        function archiveCampaign(campId) {
            const index = state.campaigns.findIndex(c => c.id === campId);
            if (index > -1) {
                const camp = state.campaigns.splice(index, 1)[0];
                state.campaignArchive.push(camp);
                saveStateToStorage(); renderUI();
            }
        }

        // Email 自動化發送 (使用你的 GAS URL)
        async function sendWeeklyEmail(email, overdueList, weeklyList) {
            const webAppUrl = "https://script.google.com/macros/s/AKfycbwCOYu7qUI0eTCPexqBU9r4gv1Pi_nio6eTisXL4yI8ralo3siyXdKm7qRd_tCd19s/exec";
            const messageBody = `<h3>本週工作進度提醒</h3><p>逾期項目：${overdueList.join(', ')}</p><p>本週待辦：${weeklyList.join(', ')}</p>`;
            try {
                await fetch(webAppUrl, { method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ recipientEmail: email, messageBody: messageBody }) });
                triggerCustomAlert("成功", "週報郵件已寄出！", false);
            } catch (e) { triggerCustomAlert("失敗", "郵件寄送異常：" + e.message, false); }
        }

        // 擴充 renderUI 加入自動封存檢查
        function renderUI() {
            archiveOldAdminTasks();
            // ... 原有邏輯 ...
            renderCampaignDashboard(); // 需在 Dashboard 內根據 show-archived-campaigns 判斷是否顯示封存陣列
        }

        // 修改 Dashboard 渲染，加入封存專案的開關邏輯
        function renderCampaignDashboard() {
            const showArchived = document.getElementById('show-archived-campaigns')?.checked;
            let displayList = [...state.campaigns];
            if (showArchived) displayList = [...displayList, ...state.campaignArchive];
            
            const grid = document.getElementById('campaign-grid'); grid.innerHTML = '';
            displayList.forEach(camp => {
                // ... 渲染卡片 ...
                // 若未封存，加入封存按鈕
                if (!showArchived) {
                    // 在卡片內插入：<button onclick="archiveCampaign('${camp.id}')">📦 封存</button>
                }
            });
        }

        // 其餘邏輯保持原樣，確保你的命名與邏輯不受干擾
    </script>
</body>
</html>
